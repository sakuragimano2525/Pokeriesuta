/* ★ index.html 1枚で「外枠」と「ゲーム本体」の両方をまかなう（以前の index.html + game.html を統合）
   ・ふつうに開く → 外枠モード：マップごとに「自分自身(index.html)」を iframe で開いて切り替える
   ・iframe の中 / ?nowrap=1 で開く → ゲームモード：ゲーム本体を読み込んで遊ぶ
   ゲームモードで開いた時だけ style.css と各 .js を読み込むので、外枠モードは軽いまま。 */
(function(){var fr=window.top!==window;
 window.GF={fr:fr,wrap:!fr&&!/[?&]nowrap=1/.test(location.search)};

 if(fr){try{parent.postMessage('gf-ready','*')}catch(e){}}})();

<script>
(function(){
 var Q=location.search,BASE=location.pathname;   /* BASE = このファイル自身 */
 /* スクリプトを「並行ダウンロード・順番どおり実行」で読み込む。最後のが終わったら done */
 function load(list,done){
  var els=list.map(function(u){var s=document.createElement('script');s.src=u;s.async=false;return s}),
      last=els[els.length-1],fin=function(){if(fin.d)return;fin.d=1;if(done)done()};
  last.onload=last.onerror=fin;
  els.forEach(function(s){document.head.appendChild(s)})}

 /* ===== ゲームモード（旧 game.html） ===== */
 if(!GF.wrap){
  (function(){var h=document.documentElement;['ui1','ui2','ui3','ui4','ui5','ui6','setting','nocki','gouda','banner','banner2','banner3'].forEach(function(k){var i=new Image();i.onload=function(){h.classList.add('has-'+k)};i.src=k+'.png'})})();
  var tpl=document.getElementById('game-markup'),html=tpl.textContent;tpl.parentNode.removeChild(tpl);
  /* 裏で先読みされるフレーム(bg=1)は動画を自動再生・事前読み込みしない(複数マップ分の動画デコードで重くなるのを防ぐ)。手前に出た時に script.js が再生する */
  if(/[?&]bg=1/.test(Q))html=html.replace(' autoplay','').replace('preload="auto"','preload="none"');
  /* Firebase(オンライン対戦用)は重いので起動時には読み込まず、マルチプレイを開く時に初めて読み込む(mp-ui.js から呼ばれる) */
  window.GFLoadFB=function(cb){
   if(window.firebase&&firebase.database){cb();return}
   if(GFLoadFB.q){GFLoadFB.q.push(cb);return}
   GFLoadFB.q=[cb];
   load(['https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js','https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'],function(){
    var q=GFLoadFB.q;GFLoadFB.q=null;q.forEach(function(f){try{f()}catch(e){console.error(e)}})})};
  var started=0;
  function start(){
   if(started)return;started=1;
   document.body.insertAdjacentHTML('afterbegin',html);
   window.MPG={on:false};
   load([
   'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
   'balance.js',
   'models.js',
   'vfx.js',
   'maps.js',
   'script.js',
   'bot-ai.js',
   'mapselect.js',
   'profile.js',
   'settings.js',
   'firebase-config.js',
   'mp-net.js',
   'mp-game.js',
   'mp-ui.js'
   ],function(){
    /* 全スクリプトの実行が終わったことを外枠へ知らせる(先読み完了の合図) */
    try{if(window.top!==window)parent.postMessage({gf:'loaded'},'*')}catch(e){}})}
  var l=document.createElement('link');l.rel='stylesheet';l.href='style.css';
  l.onload=l.onerror=start;document.head.appendChild(l);   /* CSS を先に読んでから部品とスクリプトを入れる(旧 game.html と同じ順番) */
  return;
 }

 /* ===== 外枠モード（旧 index.html） ===== */
 var cv=document.createElement('div');cv.id='cv';cv.textContent='読み込み中…';document.body.appendChild(cv);
 function initWrap(){
 var P=new URLSearchParams(Q),first=P.get('map');
 var lim,KEEP,PQ=P.get('preload');
 /* 先読み数は設定(ホーム右上の歯車)で決める：高=全マップ(ブロスタ本家のようにすぐ切り替わる) / 中=1つ / 低=しない。?preload=数 で直接指定も可 */
 function pol(){var pl=2;try{var o=JSON.parse(localStorage.getItem('gemrush_cfg')||'{}');if(o.pl===0||o.pl===1)pl=o.pl}catch(e){}
  lim=PQ!==null?Math.max(0,parseInt(PQ,10)||0):(pl==2?99:pl);KEEP=pl==2?99:pl==1?3:1}
 pol();
 var okId=function(s){return /^[\w-]+$/.test(s||'')};
 if(!okId(first)){try{var st=localStorage.getItem('gemrush_map');first=okId(st)?st:'gem'}catch(e){first='gem'}}
 P.delete('map');P.delete('bg');P.delete('preload');
 var rest=P.toString(),F={},LD={},BG={},cur=first,ok=0,pend=null,fn=0;
 /* 全マップの一覧(maps.js)。先読みの順番は「別モードのマップ → 同じモードの他のマップ」 */
 var MP=[],MM={};
 (window.MAPS||[]).forEach(function(m){if(m&&okId(m.id)){MP.push(m.id);MM[m.id]=m.mode}});
 ['gem','ko','hs'].forEach(function(k){if(MP.indexOf(k)<0){MP.push(k);MM[k]=k}});
 if(MP.indexOf(first)<0){MP.push(first);MM[first]=first}
 var ORDER=MP.filter(function(k){return k!==first}).sort(function(a,b){return (MM[a]===MM[first])-(MM[b]===MM[first])});
 var loading=0,nT=0,mt0=null;   /* mt0=メニューBGMが鳴り始めた時刻(ms)。切替時に「何秒目か」を新しいマップへ渡して曲を続ける */
 function url(m,bg){return BASE+'?map='+m+(bg?'&bg=1':'')+(rest?'&'+rest:'')}
 function mk(m,bg){
  if(F[m])return F[m];
  var f=document.createElement('iframe');
  f.setAttribute('allow','fullscreen; autoplay; screen-wake-lock');f.setAttribute('allowfullscreen','');
  if(m===cur)f.className='on';
  BG[m]=!!bg;loading++;f.src=url(m,bg);document.body.appendChild(f);F[m]=f;return f}
 /* 先読み：いま読み込み中のものが無ければ、次のマップを1つだけ裏で作る(同時に何個も読んで重くならないように) */
 function next(delay){
  clearTimeout(nT);
  nT=setTimeout(function(){
   if(loading>0)return;
   var n=0;for(var k in F)if(k!==first)n++;
   if(n>=lim)return;
   for(var i=0;i<ORDER.length;i++)if(!F[ORDER[i]]){mk(ORDER[i],1);return}
  },delay)}
 /* 保持数(KEEP)を超えたら、表示中・最初のマップ・読み込み中以外の古いフレームを破棄してメモリとGPUを空ける */
 function trim(){
  var ks=Object.keys(F);
  for(var i=0;i<ks.length&&Object.keys(F).length>KEEP;i++){var k=ks[i];
   if(k===cur||k===first||!LD[k]||(pend&&pend.m===k))continue;
   try{F[k].src='about:blank';F[k].parentNode&&F[k].parentNode.removeChild(F[k])}catch(e){}
   delete F[k];delete LD[k];delete BG[k]}}
 /* 設定が変わったら(別フレームの設定画面から)すぐ反映：先読みを増やす/余分なフレームを破棄する */
 addEventListener('storage',function(e){if(e.key==='gemrush_cfg'){pol();trim();next(300)}});
 function post(m,d){try{F[m]&&F[m].contentWindow.postMessage(d,'*')}catch(e){}}
 function show(m,sel,room){
  var old=cur;cur=m;
  for(var k in F)F[k].className=(k===m)?'on':'';
  trim();
  if(old!==m)post(old,{gf:'inactive'});
  post(m,{gf:'active',sel:sel,room:room,bo:mt0==null?undefined:(performance.now()-mt0)/1000});
  cv.style.display='none';
  try{localStorage.setItem('gemrush_map',m)}catch(e){}}
 function lock(){try{screen.orientation.lock('landscape').catch(function(){})}catch(e){}}
 function fs(){
  if(document.fullscreenElement||++fn>4)return;
  try{var p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
   if(p&&p.then)p.then(lock,lock);else lock()}catch(e){}}
 addEventListener('message',function(e){
  var d=e.data;
  if(d==='gf-ready'){ok=1;return}
  if(!d||typeof d!=='object')return;
  var m=null;for(var k in F)if(F[k].contentWindow===e.source)m=k;
  if(!m)return;
  ok=1;
  if(d.gf==='loaded'){
   if(!LD[m]){LD[m]=1;loading=Math.max(0,loading-1)}
   if(pend&&pend.m===m){var p=pend;pend=null;show(m,p.sel,p.room)}
   else if(m===cur&&BG[m])post(m,{gf:'active'});   /* 先読み用として作られたフレームが再読み込みされて、いま表示中の時は動かし直す */
   next(m===first?1000:500);   /* 表示中のマップが終わったら1秒後から、先読みしたものが終わったら0.5秒後に次を先読み */
  }else if(d.gf==='map'&&m===cur){
   var t=okId(d.id)?d.id:null;
   if(!t||t===cur)return;
   if(LD[t])show(t,d.sel,d.room);
   else{pend={m:t,sel:d.sel,room:d.room};mk(t,1);cv.style.display='flex'}   /* まだ先読みされていない時だけ「読み込み中」(全画面はそのまま) */
  }else if(d.gf==='fs'&&m===cur)fs();
  else if(d.gf==='bgm'&&m===cur){if(d.n==='menu'){if(mt0==null)mt0=performance.now()}else mt0=null}
 });
 var f0=mk(first,0);
